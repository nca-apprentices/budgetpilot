name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Lint
        run: mise run lint

      - name: Format check
        run: mise run format-check

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test
