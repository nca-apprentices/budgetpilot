[tools]
"aqua:yonaskolb/XcodeGen" = "2.46.0"
"aqua:realm/SwiftLint" = "0.65.1"
"github:nicklockwood/SwiftFormat" = { version = "0.63.1", matching = "swiftformat.zip" }

# Tasks that need more than a single command live as scripts under this path.
[task_config]
includes = ["config/mise/tasks"]

[tasks.generate]
description = "Generate the Xcode project from project.yml"
run = "xcodegen generate"

[tasks.lint]
description = "Run SwiftLint over Sources/ and Tests/"
run = "swiftlint"

[tasks.format]
description = "Run SwiftFormat and write changes"
run = "swiftformat Sources Tests"

[tasks.format-check]
description = "Run SwiftFormat in lint mode (used by CI, changes nothing)"
run = "swiftformat Sources Tests --lint"

[tasks.build]
description = "Build for the iOS Simulator"
depends = ["generate"]
run = "xcodebuild build -scheme BudgetPilot -destination 'generic/platform=iOS Simulator' -derivedDataPath .build"

[tasks.simctl-reset]
description = "Shut down all running simulators"
run = "xcrun simctl shutdown all"

[tasks.clean]
description = "Remove the generated Xcode project and build artifacts"
run = "rm -rf BudgetPilot.xcodeproj .build"
