name: BudgetPilot
fileGroups:
  - project.yml
  - mise.toml
  - README.md
  - .swiftlint.yml
  - .swiftformat
  - .editorconfig
  - .github
options:
  bundleIdPrefix: com.nca
  deploymentTarget:
    iOS: "26.0"
targets:
  BudgetPilot:
    type: application
    platform: iOS
    sources:
      - Sources/BudgetPilot
    # Written by XcodeGen, not committed. GENERATE_INFOPLIST_FILE cannot
    # set CFBundleIconName at the top level, and altool rejects the upload
    # without it (90713).
    info:
      path: BudgetPilot-Info.plist
      properties:
        CFBundleDisplayName: BudgetPilot
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Taken from the build settings so fastlane can override them per
        # release; hardcoding them would send build number 1 every time.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nca.budgetsupporter
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Overridden per release by fastlane; these are only the fallbacks.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Simulator builds and CI stay unsigned, so no certificate is needed.
        debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
        # Release is signed for the device, the same way netgrade does it.
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          # Substituted by XcodeGen from the environment; fastlane sets it
          # from the TEAM_ID secret, so the id is not in the repository.
          DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
          PROVISIONING_PROFILE_SPECIFIER: budgetsupporter-provisioning
    scheme:
      testTargets:
        - BudgetPilotTests
  BudgetPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/BudgetPilotTests
    dependencies:
      - target: BudgetPilot
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
